<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HireMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">Hire<span>Mate</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login.html" class="btn btn-outline btn-sm">Login</a>
        </div>
    </nav>

    <div class="auth-wrap">
        <div class="auth-box">
            <h2>Create your account</h2>
            <p class="sub">Join HireMate as a Job Seeker or a Recruiter.</p>

            <div id="msg" class="msg"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                </div>
                <div class="form-group">
                    <label for="role">I am a</label>
                    <select id="role">
                        <option value="seeker">Job Seeker</option>
                        <option value="recruiter">Recruiter</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
        </div>
    </div>

    <script>
        // Landing page se aaye ho to role pehle se select ho jaye
        const params = new URLSearchParams(window.location.search);
        const roleFromUrl = params.get("role");
        if (roleFromUrl === "seeker" || roleFromUrl === "recruiter") {
            document.getElementById("role").value = roleFromUrl;
        }

        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const msg = document.getElementById("msg");

            const body = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                role: document.getElementById("role").value
            };

            const res = await fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (res.ok) {
                msg.className = "msg msg-success";
                msg.textContent = "Account created! Redirecting to login...";
                setTimeout(function () { window.location.href = "/login.html"; }, 1200);
            } else {
                msg.className = "msg msg-error";
                msg.textContent = data.error;
            }
        });
    </script>
</body>
</html>
