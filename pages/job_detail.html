<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Details | HireMate</title>
<link rel="stylesheet" href="/static/hm.css">
<style>
  .desc{white-space:pre-wrap;line-height:1.55}
  .bigscore{font-size:32px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="browse_jobs.html">&larr; Back</a>
  <div id="content"><p>Loading...</p></div>
</div>
<script src="/static/apply.js"></script>
<script>
function color(n) { return n >= 60 ? '#22a35a' : (n >= 35 ? '#e8912d' : '#d64545'); }
const jobId = new URLSearchParams(window.location.search).get('id');
const content = document.getElementById('content');

function load() {
  fetch('/api/job?id=' + encodeURIComponent(jobId)).then(r => {
    if (r.status === 401) { window.location.href = 'login.html'; return null; }
    return r.json();
  }).then(j => {
    if (!j) return;
    if (j.error) { content.innerHTML = '<p>' + escapeHtml(j.error) + '</p>'; return; }
    if (j.role === 'recruiter') document.getElementById('back').href = 'my_jobs.html';

    let html = `<div class="card">
      <h1>${escapeHtml(j.title)}</h1>
      <div class="meta">${escapeHtml(j.company)} &bull; ${escapeHtml(j.location)} &bull; ${escapeHtml(j.experience)}
        ${j.source === 'recruiter' ? '<span class="badge">Posted on HireMate</span>' : ''}</div>
      ${j.skills.map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('')}
    </div>`;

    if (j.match) {
      const missing = !j.skills.length ? '<span class="meta">No skills listed in this job</span>'
        : (!j.match.missing.length ? '<span class="chip ok">You have all listed skills \u2713</span>'
        : j.match.missing.map(s => `<span class="chip miss">${escapeHtml(s)}</span>`).join(''));
      html += `<div class="card">
        <div class="bigscore" style="color:${color(j.match.score)}">${j.match.score}% match</div>
        <div class="label">You have:</div>
        ${j.match.matched.map(s => `<span class="chip ok">${escapeHtml(s)}</span>`).join('') || '-'}
        <div class="label">Missing:</div>
        ${missing}
      </div>`;
    }

    html += `<div class="card"><h3>Job description</h3><div class="desc">${escapeHtml(j.description)}</div></div>`;

    if (j.role === 'seeker') {
      html += `<div class="actions">${actionButtons(j)}</div>`;
    }
    content.innerHTML = html;
  }).catch(() => { content.innerHTML = '<p>Something went wrong.</p>'; });
}
bindActions(content, load);
load();
</script>
</body>
</html>
