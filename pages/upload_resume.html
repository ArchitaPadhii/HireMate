<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume | HireMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/seeker_dashboard.html" class="logo">Hire<span>Mate</span></a>
        <div class="nav-links">
            <a href="/seeker_dashboard.html">Dashboard</a>
            <a href="/upload_resume.html" class="active">Upload Resume</a>
            <a href="/browse_jobs.html">Browse Jobs</a>
            <a href="/recommended_jobs.html">Recommended Jobs</a>
            <span class="user-chip" id="userName"></span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="dash">
        <h1>Upload your resume</h1>
        <p class="sub">Upload a text-based PDF (max 5 MB). We will read it and analyze your skills.</p>

        <div class="panel">
            <div id="msg" class="msg"></div>

            <label class="upload-box" for="fileInput">
                <div class="upload-icon">📄</div>
                <p class="upload-title">Click to choose your PDF resume</p>
                <p class="upload-hint" id="fileName">No file selected</p>
            </label>
            <input type="file" id="fileInput" accept="application/pdf" hidden>

            <button class="btn btn-primary" id="uploadBtn">Upload Resume</button>
        </div>

        <div class="panel" id="resumePanel" style="display: none;">
            <h3 id="resumeTitle">Your resume</h3>
            <p class="sub" id="resumeMeta"></p>
            <p class="preview-label">Extracted text preview</p>
            <pre class="preview" id="preview"></pre>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        const fileInput = document.getElementById("fileInput");
        const uploadBtn = document.getElementById("uploadBtn");
        const msg = document.getElementById("msg");

        function showMessage(text, type) {
            msg.className = "msg msg-" + type;
            msg.textContent = text;
        }

        function showResume(filename, chars, preview) {
            document.getElementById("resumePanel").style.display = "block";
            document.getElementById("resumeTitle").textContent = filename;
            document.getElementById("resumeMeta").textContent =
                chars + " characters of text extracted";
            document.getElementById("preview").textContent = preview;
        }

        fileInput.addEventListener("change", function () {
            if (fileInput.files.length > 0) {
                document.getElementById("fileName").textContent = fileInput.files[0].name;
            }
        });

        uploadBtn.addEventListener("click", async function () {
            if (fileInput.files.length === 0) {
                showMessage("Please choose a PDF file first.", "error");
                return;
            }

            const file = fileInput.files[0];

            if (!file.name.toLowerCase().endsWith(".pdf")) {
                showMessage("Only PDF files are allowed.", "error");
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                showMessage("File is too large (max 5 MB).", "error");
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = "Uploading...";

            try {
                const res = await fetch("/api/upload_resume", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/pdf",
                        "X-Filename": encodeURIComponent(file.name)
                    },
                    body: file
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage("Resume uploaded! Score: " + data.score + "/100. Opening your analysis...", "success");
                    setTimeout(function () { window.location.href = "/resume_result.html"; }, 1200);
                } else {
                    showMessage(data.error, "error");
                }
            } catch (err) {
                showMessage("Something went wrong. Please try again.", "error");
            }

            uploadBtn.disabled = false;
            uploadBtn.textContent = "Upload Resume";
        });

        async function init() {
            const user = await loadUser();
            if (!user) return;

            const res = await fetch("/api/seeker/resume");
            const data = await res.json();
            if (data.uploaded) {
                showResume(data.filename, data.chars, data.preview);
            }
        }
        init();
    </script>
</body>
</html>
