<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Jobs | HireMate</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6fb;margin:0;color:#222}
  .wrap{max-width:900px;margin:30px auto;padding:0 16px}
  a.back{color:#4b36b8;text-decoration:none}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .filters input,.filters select{padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;flex:1;min-width:150px}
  button{background:#4b36b8;color:#fff;border:0;padding:10px 20px;border-radius:8px;font-size:15px;cursor:pointer}
  button:disabled{background:#aaa;cursor:default}
  .card{background:#fff;border-radius:12px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h3{margin:0 0 4px}
  .card h3 a{color:#222;text-decoration:none}
  .meta{color:#666;font-size:14px;margin-bottom:6px}
  .snippet{font-size:14px;color:#444}
  .chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;margin:2px;background:#eceef5}
  .badge{background:#e8e4ff;color:#4b36b8;padding:2px 8px;border-radius:10px;font-size:12px}
  .actions{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .actions button{padding:8px 18px;font-size:14px}
  a.mailBtn{border:1px solid #4b36b8;color:#4b36b8;padding:7px 16px;border-radius:8px;font-size:14px;text-decoration:none}
  a.detailBtn{color:#4b36b8;font-size:14px}
  .pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="seeker_dashboard.html">&larr; Dashboard</a>
  <h1>Browse Jobs</h1>
  <div class="filters">
    <input id="fq" placeholder="Title, company or skill">
    <input id="floc" placeholder="Location">
    <select id="fsrc">
      <option value="">All jobs</option>
      <option value="recruiter">Posted on HireMate</option>
      <option value="dataset">Dataset jobs</option>
    </select>
    <button id="goBtn">Search</button>
  </div>
  <p id="info"></p>
  <div id="jobList"></div>
  <div class="pager">
    <button id="prevBtn">Prev</button><span id="pageText"></span><button id="nextBtn">Next</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let page=1,pages=1,me={name:'',email:''};

fetch('/api/me').then(r=>r.json()).then(u=>{me=u;});

function mailLink(j){
  const subject='Application for '+j.title+' - '+j.company;
  const body='Hello,\n\nI would like to apply for the '+j.title+' position at '+j.company+
             '.\nMy resume is attached.\n\nRegards,\n'+me.name+'\n'+me.email;
  return 'mailto:'+j.contact_email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
}

function load(){
  const p=new URLSearchParams({q:$('fq').value,location:$('floc').value,source:$('fsrc').value,page:page});
  fetch('/api/jobs?'+p).then(r=>{
    if(r.status===401){window.location.href='login.html';return null;}
    return r.json();
  }).then(d=>{
    if(!d)return;
    page=d.page;pages=d.pages;
    $('info').textContent=d.total+' jobs found';
    $('jobList').innerHTML=d.jobs.map(j=>`
      <div class="card">
        <h3><a href="job_detail.html?id=${j.id}">${esc(j.title)}</a>
          ${j.source==='recruiter'?'<span class="badge">Posted on HireMate</span>':''}</h3>
        <div class="meta">${esc(j.company)} &bull; ${esc(j.location)} &bull; ${esc(j.experience)}</div>
        ${j.skills.slice(0,8).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}
        <div class="snippet">${esc(j.snippet)}</div>
        <div class="actions">
          <button class="applyBtn" data-id="${j.id}" ${j.applied?'disabled':''}>${j.applied?'Applied \u2713':'Apply'}</button>
          ${j.contact_email?`<a class="mailBtn" href="${esc(mailLink(j))}">\u2709 Email recruiter</a>`:''}
          <a class="detailBtn" href="job_detail.html?id=${j.id}">View details</a>
        </div>
      </div>`).join('');
    $('pageText').textContent='Page '+page+' of '+pages;
    $('prevBtn').disabled=page<=1;
    $('nextBtn').disabled=page>=pages;
  });
}

// Apply button (works for every card)
$('jobList').addEventListener('click',e=>{
  const btn=e.target.closest('.applyBtn');
  if(!btn||btn.disabled)return;
  btn.disabled=true;
  fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:Number(btn.dataset.id)})}).then(r=>r.json()).then(d=>{
    if(d.message){btn.textContent='Applied \u2713';}
    else{alert(d.error);btn.disabled=false;}
  });
});

$('goBtn').addEventListener('click',()=>{page=1;load();});
$('prevBtn').addEventListener('click',()=>{page--;load();});
$('nextBtn').addEventListener('click',()=>{page++;load();});
$('fq').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load();}});
load();
</script>
</body>
</html>
