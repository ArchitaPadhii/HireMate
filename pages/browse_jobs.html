<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Jobs | HireMate</title>
<link rel="stylesheet" href="/static/hm.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="seeker_dashboard.html">&larr; Dashboard</a>
  <h1>Browse Jobs</h1>
  <div class="filters">
    <input id="fq" placeholder="Title, company or skill">
    <input id="floc" placeholder="Location">
    <select id="fsrc">
      <option value="">All jobs</option>
      <option value="recruiter">Posted on HireMate</option>
      <option value="dataset">Dataset jobs</option>
    </select>
    <button class="btn" id="goBtn">Search</button>
  </div>
  <p id="info"></p>
  <div id="jobList"></div>
  <div class="pager">
    <button class="btn" id="prevBtn">Prev</button><span id="pageText"></span><button class="btn" id="nextBtn">Next</button>
  </div>
</div>
<script src="/static/apply.js"></script>
<script>
const $ = id => document.getElementById(id);
let page = 1, pages = 1;

function load() {
  const p = new URLSearchParams({q: $('fq').value, location: $('floc').value, source: $('fsrc').value, page: page});
  fetch('/api/jobs?' + p).then(r => {
    if (r.status === 401) { window.location.href = 'login.html'; return null; }
    return r.json();
  }).then(d => {
    if (!d) return;
    page = d.page; pages = d.pages;
    $('info').textContent = d.total + ' jobs found';
    $('jobList').innerHTML = d.jobs.map(j => `
      <div class="card">
        <h3><a href="job_detail.html?id=${j.id}">${escapeHtml(j.title)}</a>
          ${j.source === 'recruiter' ? '<span class="badge">Posted on HireMate</span>' : ''}</h3>
        <div class="meta">${escapeHtml(j.company)} &bull; ${escapeHtml(j.location)} &bull; ${escapeHtml(j.experience)}</div>
        ${j.skills.slice(0, 8).map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('')}
        <div class="snippet">${escapeHtml(j.snippet)}</div>
        <div class="actions">${actionButtons(j)}</div>
      </div>`).join('');
    $('pageText').textContent = 'Page ' + page + ' of ' + pages;
    $('prevBtn').disabled = page <= 1;
    $('nextBtn').disabled = page >= pages;
  });
}
bindActions($('jobList'), load);
$('goBtn').addEventListener('click', () => { page = 1; load(); });
$('prevBtn').addEventListener('click', () => { page--; load(); });
$('nextBtn').addEventListener('click', () => { page++; load(); });
$('fq').addEventListener('keydown', e => { if (e.key === 'Enter') { page = 1; load(); } });
load();
</script>
</body>
</html>
