<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recommended Jobs | HireMate</title>
<link rel="stylesheet" href="/static/hm.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="seeker_dashboard.html">&larr; Dashboard</a>
  <h1>Recommended Jobs</h1>
  <p id="status">Finding your best matches...</p>
  <div id="list"></div>
</div>
<script src="/static/apply.js"></script>
<script>
function color(n) { return n >= 60 ? '#22a35a' : (n >= 35 ? '#e8912d' : '#d64545'); }

function missingHtml(j) {
  if (!j.skills.length) return '<span class="meta">No skills listed in this job</span>';
  if (!j.missing.length) return '<span class="chip ok">You have all listed skills \u2713</span>';
  return j.missing.map(s => `<span class="chip miss">${escapeHtml(s)}</span>`).join('');
}

function load() {
  fetch('/api/seeker/recommended').then(r => r.json()).then(data => {
    const status = document.getElementById('status');
    if (!data.uploaded) {
      status.innerHTML = 'Pehle <a href="upload_resume.html">resume upload</a> karo.';
      return;
    }
    status.textContent = 'Top ' + data.jobs.length + ' matches (skills + TF-IDF similarity)';
    document.getElementById('list').innerHTML = data.jobs.map(j => `
      <div class="card row">
        <div class="score" style="background:${color(j.score)}">${j.score}%</div>
        <div class="grow">
          <h3><a href="job_detail.html?id=${j.id}">${escapeHtml(j.title)}</a>
            ${j.source === 'recruiter' ? '<span class="badge">Posted on HireMate</span>' : ''}</h3>
          <div class="meta">${escapeHtml(j.company)} &bull; ${escapeHtml(j.location)} &bull; ${escapeHtml(j.experience)}</div>
          <div class="label">You have:</div>
          ${j.matched.map(s => `<span class="chip ok">${escapeHtml(s)}</span>`).join('') || '<span class="meta">None of the listed skills yet</span>'}
          <div class="label">Missing:</div>
          ${missingHtml(j)}
          <div class="actions">${actionButtons(j)}</div>
        </div>
      </div>`).join('');
  }).catch(() => { document.getElementById('status').textContent = 'Something went wrong.'; });
}
bindActions(document.getElementById('list'), load);
load();
</script>
</body>
</html>
