<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Applications | HireMate</title>
<link rel="stylesheet" href="/static/hm.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="seeker_dashboard.html">&larr; Dashboard</a>
  <h1>My Applications</h1>
  <p id="info"></p>
  <div id="list"></div>
</div>
<script src="/static/apply.js"></script>
<script>
const label = {pending: 'Waiting for reply', accepted: 'Accepted', rejected: 'Rejected'};

function load() {
  fetch('/api/seeker/applications').then(r => r.json()).then(d => {
    const apps = d.applications || [];
    document.getElementById('info').textContent = apps.length + ' application' + (apps.length === 1 ? '' : 's');
    if (!apps.length) {
      document.getElementById('list').innerHTML =
        '<div class="empty">No Replies yet!! <a href="browse_jobs.html">Browse jobs</a></div>';
      return;
    }
    document.getElementById('list').innerHTML = apps.map(a => `
      <div class="card">
        <div class="top">
          <div>
            <h3><a href="job_detail.html?id=${a.job_id}">${escapeHtml(a.title)}</a>
              ${a.source === 'recruiter' ? '<span class="badge">Posted on HireMate</span>' : ''}</h3>
            <div class="meta">${escapeHtml(a.company)} &bull; ${escapeHtml(a.location)} &bull; Applied on ${escapeHtml((a.applied_at || '').slice(0, 10))}</div>
          </div>
          <span class="status ${a.status}">${label[a.status] || a.status}</span>
        </div>
        ${a.source === 'dataset' ? '<div class="meta">Dataset job: HireMate pe iska recruiter nahi hai, isliye reply nahi aayega.</div>' : ''}
        ${a.reply_message ? `<div class="reply"><b>Company reply:</b>\n${escapeHtml(a.reply_message)}</div>` : ''}
        ${a.status === 'pending' ? `<div class="actions"><button class="btn withdraw" data-act="withdraw" data-id="${a.job_id}">Withdraw</button></div>` : ''}
      </div>`).join('');
  });
}
bindActions(document.getElementById('list'), load);
load();
</script>
</body>
</html>
